version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: noSQL-lab-postgres
    environment:
      POSTGRES_USER: dofkee
      POSTGRES_PASSWORD: helloworld
      POSTGRES_DB: demo_db
    ports:
      - "5001:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database-example/demo-20250901-3m.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped


volumes:
  pgdata: